<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="top-bar">
        <h1>Dominion</h1>
        <h4>Modo, veni, vici</h4>
        <div id="player-id-display" style="font-weight: bold;">Connecting...</div>
    </div>

    <div id="game-container">
        <div id="left-panel">
            <div id="player-list-container">
                <div id="player-list"></div>
                <button id="ready-btn">Ready Up</button>
            </div>
            <div id="timeline-controls" class="hidden">
                <h3>Timeline Controls</h3>
                <button id="split-timeline-btn">Split Timeline</button>
                <button id="freeze-timeline-btn">Freeze Timeline</button>
                <button id="overclock-timeline-btn">Overclock Timeline</button>
                <button id="rollback-timeline-btn">Rollback Timeline</button>
                <button id="anchor-timeline-btn">Anchor Timeline (Cost: 200)</button>
                <button id="hop-timeline-btn">Open Portal</button>
            </div>
            <div id="customization-container">
                <details open>
                    <summary>Game Customizations</summary>
                    <div class="customization-options">
                        <div class="option-item">
                            <label for="fogToggle">Enforce Fog of War</label>
                            <input type="checkbox" id="fogToggle">
                        </div>
                        <div class="option-item">
                            <label for="staggeredStartToggle">Staggered Start (1k Army)</label>
                            <input type="checkbox" id="staggeredStartToggle">
                        </div>
                        <div class="option-item">
                            <label for="fairGeneralsToggle">Fair Generals (Equal Starts)</label>
                            <input type="checkbox" id="fairGeneralsToggle">
                        </div>
                        <div class="option-item">
                            <label for="mountainPercent">Mountains %</label>
                            <input type="range" id="mountainPercent" min="0" max="50" >
                        </div>
                        <div class="option-item">
                            <label for="forestPercent">Forests %</label>
                            <input type="range" id="forestPercent" min="0" max="50" >
                        </div>
                         <div class="option-item">
                            <label for="cityCount">Cities (per 1200 tiles)</label>
                            <input type="range" id="cityCount" min="0" max="20" >
                        </div>
                         <div class="option-item">
                             <label for="maxMovingArmies">Max Moving Armies (1-10)</label>
                             <input type="range" id="maxMovingArmies" min="1" max="10" value="3">
                         </div>
                    </div>
                </details>
            </div>
        </div>

        <div id="canvas-container">
            <div id="game-status"></div>
            <canvas id="gameCanvas"></canvas>
        </div>

        <div id="timeline-list-container" class="hidden">
            <h2>Active Timelines</h2>
            <canvas id="timeline-tree-canvas" width="300" height="600"></canvas>
            <div id="timeline-scrubber" class="hidden"></div>
            <div id="history-preview-container" class="hidden">
                <canvas id="history-preview-canvas" width="300" height="300"></canvas>
                <div id="history-preview-info"></div>
            </div>
        </div>
    </div>

    <div id="custom-modal-overlay" class="hidden">
        <div id="custom-modal">
            <h3 id="modal-title">Modal Title</h3>
            <p id="modal-message">This is the modal message.</p>
            <input type="number" id="modal-input" class="hidden">
            <div id="modal-cost-display"></div>
            <div class="modal-buttons">
                <button id="modal-cancel-btn">Cancel</button>
                <button id="modal-confirm-btn">Confirm</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
